# Dependabot (08 § CI/CD): npm lockfile + Docker base image.
# Base-image PRs move the pinned node:26.12-slim tag — review the Node
# changelog for node:sqlite changes before merging (04 § Implementation notes).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
